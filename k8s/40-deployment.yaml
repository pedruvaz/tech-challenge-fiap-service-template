apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-template
  namespace: tech-challenge # definido pela plataforma (Matheus)
  labels:
    app.kubernetes.io/name: service-template
    app.kubernetes.io/part-of: tech-challenge-fiap
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-template
        app.kubernetes.io/part-of: tech-challenge-fiap
    spec:
      # Dá tempo do preStop + shutdown hook (consumer SQS, relay) pararem
      terminationGracePeriodSeconds: 30
      containers:
        - name: service-template
          image: REPLACE_ME_ECR/service-template:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/main"]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: service-template-config
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
